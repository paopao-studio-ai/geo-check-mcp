[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-check-mcp"
version = "0.1.0"
description = "MCP server that checks a website's AI-search (GEO) readiness: AI crawler access in robots.txt, JSON-LD schema, llms.txt, sitemap."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["mcp>=1.2"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
geo-check-mcp = "geo_check_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
